apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-services-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Autocomplete Path
          - path: "/api/v1/auto"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.autocomplete.api.name }}
                port:
                  number: 80
          # Relkey Path
          - path: "/api/v1/relkey"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.relkey.api.name }}
                port:
                  number: 80